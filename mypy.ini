[mypy]
# The type gate starts with the two layers that hold the business rules.
# app/webui is a thin read-only adapter over SQLite and is not checked yet:
# its query mixins reach for attributes the facade owns, which reads as a
# wall of false positives unless every mixin declares its own contract.
python_version = 3.10
files = app/core, app/scheduler
ignore_missing_imports = True
warn_unused_configs = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = False

[mypy-app.core.database_manager]
# self.conn is deliberately None-able at runtime: close() clears it so a
# later use fails loudly instead of hitting a closed handle. The module
# reads self.conn directly in ~30 places, so widening the declared type
# would bury the real findings under "None has no attribute" noise.
# The runtime behaviour stays exactly as it is.
disable_error_code = assignment
