name: Bug 报告
description: 报告可复现的缺陷。功能建议请使用「功能建议」模板。
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你发现问题。

        **请勿在公开 Issue 中粘贴 Cookie、数据库内容或任何登录凭据。**
        如果问题涉及凭据泄露，请改用 [私有漏洞报告](https://github.com/Stars4422335/BiliArchive-Pro/security/advisories/new)。

  - type: input
    id: version
    attributes:
      label: BiliArchive-Pro 版本
      description: 运行 `python main.py --version` 的输出，或所用 Release 标签
      placeholder: "1.6.0"
    validations:
      required: true

  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - 本地 Python 直接运行
        - Docker / Docker Compose
        - PyInstaller 打包的可执行文件
        - 其他
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 运行平台
      options:
        - Windows
        - macOS
        - Linux
        - NAS（群晖 / 威联通 / 飞牛等）
        - WSL
        - 其他
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python 版本
      description: 仅本地运行或打包时需要；Docker 用户可填 "镜像内置"
      placeholder: "3.12.1"
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 实际发生了什么？期望发生什么？
      placeholder: |
        扫描收藏夹时……
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 能否用最小配置稳定复现？相关 config.yaml 配置项请一并贴出（脱敏后）
      placeholder: |
        1. 收藏夹中放入一个视频
        2. 运行 python main.py --cli
        3. 观察……
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: |
        贴出报错前后约 30 行即可。请先移除其中的 Cookie、SESSDATA、路径中的用户名等信息。
      render: shell
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: 相关配置
      description: 粘贴 config.yaml 中与问题相关的片段；请移除 favorites、sync_collections 中的私人 ID
      render: yaml
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认日志与配置中不含 Cookie、SESSDATA 或其他登录凭据
          required: true
        - label: 我已尝试在最新 Release 版本上复现
          required: false
        - label: 这是安全漏洞，我会改用私有漏洞报告
          required: false