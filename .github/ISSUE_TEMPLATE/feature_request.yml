name: 功能建议
description: 提出新功能或改进想法。缺陷报告请使用「Bug 报告」模板。
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议。

        本项目的**核心原则是保护已归档的本地资产**。任何可能造成资产丢失、
        或削弱墓碑机制与孤本保护的提案，都会被谨慎评估。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说问题场景，再说解决方案。一个好的提案通常从"我现在只能……"开始。
      placeholder: |
        现在想备份 UP 主投稿，只能手动一个个加进合集……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
      description: 描述你设想的功能形态，包含配置项或界面交互（如果有）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他方案
      description: 有没有不需要改代码就能达成的办法？
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      description: 这项改动会影响哪些既有行为？
      options:
        - 仅新增功能，不改变现有行为
        - 改变默认行为（可通过配置回退）
        - 会改变既有归档或删除逻辑
        - 不确定
    validations:
      required: true

  - type: textarea
    id: alternatives-note
    attributes:
      label: 补充说明
      description: 截图、配置示例、参考项目或 B 站接口线索等
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，确认没有相同提案
          required: true
        - label: 该提案不会导致程序自动删除任何本地资产
          required: false