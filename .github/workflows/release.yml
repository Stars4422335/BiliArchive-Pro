name: Release

# 推送 vX.Y.Z 标签时构建三平台免 Python 环境分发包，并上传到该标签的 Release。
#
# PyInstaller 不能交叉编译：Windows 产物只能在 windows runner 上生成，
# macOS 只能在 macos runner 上生成。因此三平台各一个作业，而不是矩阵里的可替换维度。
#
# 只打核心引擎（main.py）。login.py 需要终端二维码交互、web.py 需要前端
# dist 构建产物，二者仍以源码方式运行，与 build.spec 的既有说明保持一致。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的版本标签，例如 v1.6.0"
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  # 源码 ZIP：与 v1.6.0 的手工流程一致，只用受跟踪内容生成。
  source:
    name: Source archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 本作业固定跑在 ubuntu-latest，runner 自带 unzip；这里只做兜底校验，
# 不再无条件 sudo（GitHub runner 的 apt 本身免密，多余的 sudo 只会掩盖问题）
      - name: Ensure unzip
        run: |
          set -euo pipefail
          if ! command -v unzip > /dev/null 2>&1; then
            apt-get update
            apt-get install -y unzip
          fi
          command -v unzip > /dev/null || { echo "unzip 不可用"; exit 1; }
          echo "unzip 就绪"

      - name: Resolve tag
        id: meta
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create source archive
        id: archive
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          git fetch --tags --force
          # 只用受跟踪内容：凭据、数据库、本地配置与本地任务记录不会进入包
          git archive --format=zip --prefix="BiliArchive-Pro-${TAG}/" \
            --output "BiliArchive-Pro-${TAG}.zip" "$TAG"

          # 审计：逐条目精确匹配归档内的顶层路径。
          # 不能把整个清单拼成一段文本做子串搜索——仓库里有
          # webui/src/data/ 与 tests/test_history_integrity.py 这类
          # 合法路径，含 "/data/" 但与根目录 data/ 毫无关系。
          ENTRIES="$(unzip -Z1 "BiliArchive-Pro-${TAG}.zip")"
          LEAKED=""
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            rel="${entry#${TAG}/}"          # 去掉 BiliArchive-Pro-vX.Y.Z/ 前缀
            rel="${rel%/}"                   # 去掉目录条目的尾斜杠
            case "$rel" in
              config.local.yaml|.env)          LEAKED="$LEAKED $rel" ;;
              data/*|downloads/*|bin/*|venv/*|logs/*|__pycache__/*|.pytest_cache/*|.mimosa/*)
                                           LEAKED="$LEAKED $rel" ;;
              本地任务计划与执行表.md)          LEAKED="$LEAKED $rel" ;;
              *.db|*.db-journal|*.db-wal|*.db-shm|*.pyc)
                                           LEAKED="$LEAKED $rel" ;;
            esac
          done <<< "$ENTRIES"

          if [ -n "$LEAKED" ]; then
            echo "发布包含不允许的路径:$LEAKED"
            exit 1
          fi
          echo "条目数: $(printf '%s\n' "$ENTRIES" | wc -l)"
          echo "source=$PWD/BiliArchive-Pro-${TAG}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload source archive
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: ${{ steps.archive.outputs.source }}
          draft: true
          prerelease: false

  build:
    name: Build (${{ matrix.label }})
    needs: source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # 任一平台失败都应看到完整结果，而不是第一个失败就取消其余
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            archive: zip
            pkg_install: choco
          - os: macos-latest
            label: macos-arm64
            archive: tar
            pkg_install: brew
          - os: ubuntu-latest
            label: linux-x64
            archive: tar
            pkg_install: apt

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      # 各平台 runner 镜像不保证预装 zip/unzip，且包管理器各不相同
      # （windows-latest 没有 sudo，用不了 apt）
      - name: Ensure archive tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zip > /dev/null 2>&1; then
            case "${{ matrix.pkg_install }}" in
              apt)  apt-get update && apt-get install -y zip unzip ;;
              brew) brew install zip unzip ;;
              choco) choco install zip --no-progress -y || true ;;
              *) echo "未知包管理器: ${{ matrix.pkg_install }}"; exit 1 ;;
            esac
          fi
          command -v zip > /dev/null || { echo "zip 仍不可用"; exit 1; }
          command -v tar > /dev/null || { echo "tar 不可用"; exit 1; }
          echo "归档工具就绪"

      - name: Build with PyInstaller
        run: python -m PyInstaller build.spec --noconfirm --clean

      # 冒烟验证：能跑出 --version 才算产物可用。
      # 这一步失败通常意味着 hiddenimports 漏了依赖或平台差异。
      - name: Smoke test executable
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            BINARY="./dist/BiliArchive-Pro/BiliArchive-Pro.exe"
          else
            BINARY="./dist/BiliArchive-Pro/BiliArchive-Pro"
            chmod +x "$BINARY"
          fi
          echo "--- version check ---"
          VERSION="$("$BINARY" --version)"
          echo "$VERSION"
          # 版本号与仓库声明一致，防止打出一个标着旧版本的包。
          # 用 python 读取而非 grep -P：macOS runner 的 BSD grep 不支持 -P。
          EXPECTED="$(python -c "import app; print(app.__version__)")"
          echo "expected: $EXPECTED"
          case "$VERSION" in
            *"$EXPECTED"*) echo "版本号一致" ;;
            *) echo "版本号不一致：产物=$VERSION 期望=$EXPECTED"; exit 1 ;;
          esac

          # 用真实运行路径验证运行时依赖齐备。
          # main.py 走到 --version 已经 import 了 bilibili_api 与 app.*，
          # 能跑通即说明它们确实被打进了 PYZ；yt_dlp 只在实际下载时才用到，
          # 这里用构建环境做一次等价导入验证。
          echo "--- runtime import check ---"
          python -c "
          import importlib
          for mod in ('yt_dlp', 'bilibili_api', 'defusedxml.minidom', 'uvicorn'):
              importlib.import_module(mod)
          print('runtime imports OK')
          "
          echo "运行时依赖验证通过"

      # 产物完整性检查。
      #
      # 刻意**不**检查磁盘上是否存在 yt_dlp / bilibili_api 等目录：
      # build.spec 用 noarchive=False，所有纯 Python 模块都压进了
      # 可执行文件内的 PYZ 归档，磁盘上根本没有这些目录——按文件查找
      # 必然误报缺失。真正的验证是产物能不能跑起来、能导入这些模块。
      - name: Verify artifact completeness
        shell: bash
        run: |
          set -euo pipefail
          DIR="dist/BiliArchive-Pro"
          test -d "$DIR" || { echo "产物目录缺失"; exit 1; }
          COUNT="$(find "$DIR" -type f | wc -l)"
          SIZE="$(du -sh "$DIR" | cut -f1)"
          echo "文件数: $COUNT  体积: $SIZE"
          # 只有嵌了二进制的依赖才会落盘，缺失说明打包配置有问题
          for pattern in "*.pyd" "*.so" "*.dll" "*.dylib"; do
            if [ "$(find "$DIR" -name "$pattern" -print -quit)" ]; then
              echo "  找到二进制依赖 $pattern"
            fi
          done
          if [ "$COUNT" -lt 20 ]; then
            echo "产物文件数异常偏少（$COUNT），打包可能不完整"
            exit 1
          fi
          echo "产物规模正常"

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.source.outputs.tag }}"
          NAME="BiliArchive-Pro-${TAG}-${{ matrix.label }}"
          # 随包附最小运行骨架，省去用户手工创建目录
          for f in config.yaml LICENSE README.md; do
            test -f "$f" || { echo "缺少 $f，无法打包"; exit 1; }
          done
          cp config.yaml LICENSE README.md dist/BiliArchive-Pro/
          mkdir -p dist/BiliArchive-Pro/bin
          printf '%s\n' \
            "本包为单目录分发，整个目录缺一不可。" \
            "1. 把 FFmpeg 放到同目录 bin/ 下（ffmpeg.exe 或 ffmpeg）。" \
            "2. 运行 BiliArchive-Pro --cli 启动守护进程。" \
            "3. 登录与 WebUI 请用源码方式，见 README。" \
            > dist/BiliArchive-Pro/安装说明.txt
          # 产物与后续 SHA256 步骤统一落在 dist/，避免工作目录错位
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && zip -r "${NAME}.zip" BiliArchive-Pro > /dev/null)
          else
            # -f 与文件名之间必须有空格：写成 -czf"NAME" 会被解析成
            # 单个选项串，GNU tar 报 "Cannot open: No such file or directory"
            tar -czf "dist/${NAME}.tar.gz" -C dist BiliArchive-Pro
          fi
          # 校验压缩包内容含可执行文件。
          # grep -q 会提前退出并让上游收到 SIGPIPE，在 pipefail 下误判失败，
          # 因此先把清单抓到变量里再判断。
          if [ "${{ matrix.archive }}" = "zip" ]; then
            LISTING="$(unzip -l "dist/${NAME}.zip")"
          else
            LISTING="$(tar -tzf "dist/${NAME}.tar.gz")"
          fi
          case "$LISTING" in
            *BiliArchive-Pro*) echo "压缩包内容正常" ;;
            *) echo "压缩包内容异常"; exit 1 ;;
          esac
          ls -lh dist/"${NAME}".*

      # 用 Python 算校验值而非 shasum / sha256sum：前者只有 macOS 有，
      # 后者不是所有 runner 都装了，而 Python 三个平台都必然存在。
      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail
          NAME="BiliArchive-Pro-${{ needs.source.outputs.tag }}-${{ matrix.label }}"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            ARCHIVE="${NAME}.zip"
          else
            ARCHIVE="${NAME}.tar.gz"
          fi
          python -c "
          import hashlib, sys
          path = sys.argv[1]
          with open(path, 'rb') as fh:
              digest = hashlib.sha256(fh.read()).hexdigest()
          with open(path + '.sha256', 'w', encoding='utf-8') as out:
              out.write(f'{digest}  {path}\n')
          print(digest, path)
          " "$ARCHIVE"
          cat "${ARCHIVE}.sha256"

      - name: Upload to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.source.outputs.tag }}
          files: |
            dist/BiliArchive-Pro-${{ needs.source.outputs.tag }}-${{ matrix.label }}.*
          draft: true

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.source.outputs.tag }}
          draft: false
          prerelease: false